import org.gradle.api.tasks.bundling.AbstractArchiveTask
plugins {
    id 'fabric-loom' version '1.17.11'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

// jar name rule: [vpl-<version>-for-<mc support range>]carpet-addition-<version>.jar
tasks.withType(AbstractArchiveTask).configureEach {
    def classifier = archiveClassifier.orNull
    def suffix = (classifier == null || classifier.isEmpty()) ? '' : "-${classifier}"
    archiveFileName = "[vpl-${project.version}-for-${project.mc_support_range}]carpet-addition-${project.version}${suffix}.${archiveExtension.get()}"
}

repositories {
    maven { url 'https://masa.dy.fi/maven' }
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "carpet:fabric-carpet:${project.carpet_version}"
    include(annotationProcessor(modImplementation("io.github.llamalad7:mixinextras-fabric:0.4.1")))
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

processResources {
    inputs.property "version", project.version
    inputs.property "mod_id", project.mod_id
    inputs.property "mod_name", project.mod_name
    filteringCharset = "UTF-8"
    filesMatching("fabric.mod.json") {
        expand project.properties
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
